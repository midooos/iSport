# Profil "dev" : base H2 en mémoire, pas besoin de PostgreSQL ni de Docker.
# Lancer avec : mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Les données sont recréées à chaque démarrage (voir DevDataLoader).
spring.datasource.url=jdbc:h2:mem:isport-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
