spring.application.name=isport-backend

# Base de données : par défaut celle du docker-compose, sinon variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/isport}
spring.datasource.username=${DB_USER:isport}
spring.datasource.password=${DB_PASSWORD:isport}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT : en production, définir JWT_SECRET (au moins 32 caractères)
app.jwt.secret=${JWT_SECRET:isport-dev-secret-a-changer-en-production-0123456789}
app.jwt.expiration-hours=24
