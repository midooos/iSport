spring.application.name=isport-backend

# Base de données : par défaut celle du docker-compose, sinon variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/isport}
spring.datasource.username=${DB_USER:isport}
spring.datasource.password=${DB_PASSWORD:isport}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
