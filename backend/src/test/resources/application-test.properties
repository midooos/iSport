# Les tests tournent sur une base H2 en mémoire : pas besoin de PostgreSQL
spring.datasource.url=jdbc:h2:mem:isport;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Compter les requêtes SQL dans les tests (EventPerformanceTest)
spring.jpa.properties.hibernate.generate_statistics=true
